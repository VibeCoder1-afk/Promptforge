version: "3.8"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/promptforge
      - JWT_SECRET=change_me_in_production
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - PORT=5000
    depends_on:
      - mongo

volumes:
  mongo_data:
